<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEX MASTERY — 7-Day Sprint</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080c10;
  --surface: #0d1117;
  --surface2: #161b22;
  --border: #21262d;
  --accent: #00ff88;
  --accent2: #ff4466;
  --accent3: #ffaa00;
  --accent4: #00aaff;
  --text: #e6edf3;
  --text-dim: #7d8590;
  --text-dimmer: #3d4450;
  --mono: 'Space Mono', monospace;
  --display: 'Bebas Neue', sans-serif;
  --body: 'DM Sans', sans-serif;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--body);
  min-height: 100vh;
  overflow-x: hidden;
}

/* GRID BACKGROUND */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,255,136,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,136,0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}

/* HEADER */
header {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  background: rgba(8,12,16,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  font-family: var(--display);
  font-size: 28px;
  letter-spacing: 3px;
  color: var(--accent);
  text-shadow: 0 0 20px rgba(0,255,136,0.4);
}

.logo span { color: var(--text-dim); }

.header-meta {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-dim);
  text-align: right;
}

.progress-bar-outer {
  width: 200px;
  height: 3px;
  background: var(--border);
  border-radius: 2px;
  margin-top: 4px;
}
.progress-bar-inner {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent4));
  border-radius: 2px;
  transition: width 0.5s ease;
}

/* LAYOUT */
.app-layout {
  display: flex;
  padding-top: 64px;
  min-height: 100vh;
}

/* SIDEBAR */
.sidebar {
  width: 280px;
  flex-shrink: 0;
  position: fixed;
  left: 0;
  top: 64px;
  bottom: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  z-index: 50;
  padding: 16px 0;
}

.sidebar-section-title {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-dimmer);
  letter-spacing: 2px;
  padding: 12px 20px 8px;
  text-transform: uppercase;
}

.day-nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 20px;
  cursor: pointer;
  border-left: 3px solid transparent;
  transition: all 0.2s;
  position: relative;
}

.day-nav-item:hover { background: var(--surface2); }

.day-nav-item.active {
  border-left-color: var(--accent);
  background: rgba(0,255,136,0.05);
}

.day-nav-item.completed .day-badge {
  background: var(--accent);
  color: var(--bg);
}

.day-badge {
  width: 32px;
  height: 32px;
  border-radius: 6px;
  background: var(--surface2);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-dim);
  flex-shrink: 0;
  transition: all 0.2s;
}

.day-nav-info { flex: 1; min-width: 0; }

.day-nav-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.day-nav-sub {
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 2px;
}

.day-nav-item.active .day-nav-title { color: var(--accent); }

.lesson-nav {
  padding: 0 8px 0 64px;
  display: none;
}

.day-nav-item.active + .lesson-nav { display: block; }

.lesson-nav-item {
  font-size: 12px;
  color: var(--text-dim);
  padding: 6px 12px;
  cursor: pointer;
  border-radius: 4px;
  transition: all 0.15s;
}
.lesson-nav-item:hover { color: var(--text); background: var(--surface2); }
.lesson-nav-item.active-lesson { color: var(--accent); }

/* MAIN CONTENT */
.main {
  margin-left: 280px;
  flex: 1;
  padding: 40px 48px;
  max-width: 1100px;
}

/* DAY HERO */
.day-hero {
  margin-bottom: 40px;
  padding-bottom: 32px;
  border-bottom: 1px solid var(--border);
}

.day-tag {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--accent);
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 8px;
}

.day-title {
  font-family: var(--display);
  font-size: 56px;
  letter-spacing: 2px;
  line-height: 1;
  color: var(--text);
  margin-bottom: 12px;
}

.day-subtitle {
  font-size: 16px;
  color: var(--text-dim);
  line-height: 1.6;
  max-width: 700px;
}

.ticker-badges {
  display: flex;
  gap: 8px;
  margin-top: 16px;
}

.ticker-badge {
  padding: 4px 12px;
  border-radius: 4px;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
}

.tb-spy { background: rgba(0,170,255,0.1); color: var(--accent4); border: 1px solid rgba(0,170,255,0.2); }
.tb-qqq { background: rgba(255,170,0,0.1); color: var(--accent3); border: 1px solid rgba(255,170,0,0.2); }
.tb-tsla { background: rgba(255,68,102,0.1); color: var(--accent2); border: 1px solid rgba(255,68,102,0.2); }

/* LESSON SECTIONS */
.lesson-block {
  margin-bottom: 48px;
  scroll-margin-top: 90px;
}

.lesson-header {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 24px;
}

.lesson-type-badge {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 2px;
  padding: 4px 10px;
  border-radius: 3px;
  text-transform: uppercase;
  flex-shrink: 0;
}

.lt-A { background: rgba(0,255,136,0.1); color: var(--accent); border: 1px solid rgba(0,255,136,0.2); }
.lt-B { background: rgba(0,170,255,0.1); color: var(--accent4); border: 1px solid rgba(0,170,255,0.2); }
.lt-C { background: rgba(255,68,102,0.1); color: var(--accent2); border: 1px solid rgba(255,68,102,0.2); }
.lt-D { background: rgba(255,170,0,0.1); color: var(--accent3); border: 1px solid rgba(255,170,0,0.2); }

.lesson-title {
  font-size: 20px;
  font-weight: 600;
  color: var(--text);
}

.content-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 28px;
  margin-bottom: 20px;
}

.content-card p {
  font-size: 15px;
  line-height: 1.8;
  color: #c9d1d9;
  margin-bottom: 14px;
}

.content-card p:last-child { margin-bottom: 0; }

.highlight-box {
  background: rgba(0,255,136,0.04);
  border: 1px solid rgba(0,255,136,0.15);
  border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0;
  padding: 16px 20px;
  margin: 16px 0;
}

.highlight-box.red {
  background: rgba(255,68,102,0.04);
  border-color: rgba(255,68,102,0.15);
  border-left-color: var(--accent2);
}

.highlight-box.yellow {
  background: rgba(255,170,0,0.04);
  border-color: rgba(255,170,0,0.15);
  border-left-color: var(--accent3);
}

.highlight-box.blue {
  background: rgba(0,170,255,0.04);
  border-color: rgba(0,170,255,0.15);
  border-left-color: var(--accent4);
}

.highlight-box p { margin-bottom: 0; color: var(--text) !important; }
.highlight-box strong { color: var(--accent); }
.highlight-box.red strong { color: var(--accent2); }
.highlight-box.yellow strong { color: var(--accent3); }
.highlight-box.blue strong { color: var(--accent4); }

/* FORMULA BLOCKS */
.formula-block {
  background: #0a0e12;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 20px 24px;
  margin: 16px 0;
  font-family: var(--mono);
  font-size: 13px;
  color: var(--accent);
  overflow-x: auto;
}

.formula-block .formula-label {
  color: var(--text-dimmer);
  font-size: 10px;
  letter-spacing: 2px;
  margin-bottom: 8px;
}

.formula-block .formula-main {
  font-size: 16px;
  color: var(--accent);
  margin-bottom: 6px;
}

.formula-block .formula-note {
  color: var(--text-dim);
  font-size: 11px;
  margin-top: 8px;
}

/* DIAGRAMS */
.diagram-container {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
  margin: 20px 0;
}

.diagram-title {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-dim);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 16px;
}

canvas, svg {
  max-width: 100%;
  border-radius: 6px;
}

/* STRESS TEST */
.stress-test-card {
  background: rgba(255,68,102,0.04);
  border: 1px solid rgba(255,68,102,0.2);
  border-radius: 12px;
  padding: 28px;
  margin-top: 24px;
}

.stress-test-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}

.stress-test-icon {
  width: 36px;
  height: 36px;
  background: rgba(255,68,102,0.1);
  border: 1px solid rgba(255,68,102,0.3);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
}

.stress-test-label {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--accent2);
  letter-spacing: 2px;
}

.stress-question {
  font-size: 15px;
  line-height: 1.7;
  color: var(--text);
  margin-bottom: 20px;
}

.answer-area {
  width: 100%;
  min-height: 100px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
  color: var(--text);
  font-family: var(--body);
  font-size: 14px;
  resize: vertical;
  transition: border-color 0.2s;
  line-height: 1.6;
}

.answer-area:focus {
  outline: none;
  border-color: var(--accent2);
}

.submit-answer-btn {
  margin-top: 12px;
  padding: 10px 24px;
  background: var(--accent2);
  color: white;
  border: none;
  border-radius: 6px;
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1px;
  cursor: pointer;
  transition: all 0.2s;
}

.submit-answer-btn:hover { background: #ff6688; transform: translateY(-1px); }
.submit-answer-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

.ai-feedback {
  margin-top: 16px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  font-size: 14px;
  line-height: 1.7;
  color: var(--text);
  display: none;
}

.ai-feedback.show { display: block; }

.feedback-label {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--accent);
  letter-spacing: 2px;
  margin-bottom: 10px;
}

/* KEY CONCEPT GRID */
.concept-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px;
  margin: 20px 0;
}

.concept-card {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 20px;
  transition: border-color 0.2s;
}

.concept-card:hover { border-color: var(--accent); }

.concept-symbol {
  font-family: var(--display);
  font-size: 36px;
  color: var(--accent);
  line-height: 1;
  margin-bottom: 8px;
}

.concept-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 6px;
}

.concept-desc {
  font-size: 13px;
  color: var(--text-dim);
  line-height: 1.6;
}

/* COMPARISON TABLE */
.compare-table {
  width: 100%;
  border-collapse: collapse;
  margin: 16px 0;
  font-size: 14px;
}

.compare-table th {
  background: var(--surface2);
  color: var(--text-dim);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 1px;
  padding: 12px 16px;
  text-align: left;
  border: 1px solid var(--border);
}

.compare-table td {
  padding: 12px 16px;
  border: 1px solid var(--border);
  color: #c9d1d9;
  line-height: 1.5;
}

.compare-table tr:nth-child(even) td { background: rgba(255,255,255,0.02); }
.compare-table .go { color: var(--accent); font-weight: 600; }
.compare-table .nogo { color: var(--accent2); font-weight: 600; }

/* DAY NAV BUTTONS */
.day-nav-btns {
  display: flex;
  gap: 12px;
  margin-top: 48px;
  padding-top: 32px;
  border-top: 1px solid var(--border);
}

.nav-btn {
  padding: 12px 28px;
  border-radius: 8px;
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1px;
  cursor: pointer;
  transition: all 0.2s;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
}

.nav-btn:hover { border-color: var(--accent); color: var(--accent); }
.nav-btn.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.nav-btn.primary:hover { background: #00dd77; }

/* STEP LIST */
.step-list {
  list-style: none;
  counter-reset: step;
  margin: 16px 0;
}

.step-list li {
  counter-increment: step;
  display: flex;
  gap: 16px;
  margin-bottom: 16px;
  font-size: 14px;
  line-height: 1.7;
  color: #c9d1d9;
}

.step-list li::before {
  content: counter(step);
  min-width: 28px;
  height: 28px;
  background: rgba(0,255,136,0.1);
  border: 1px solid rgba(0,255,136,0.2);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--accent);
  flex-shrink: 0;
  margin-top: 2px;
}

/* TICKER SPECIFIC */
.ticker-section {
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  margin: 16px 0;
}

.ticker-section-header {
  padding: 12px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1px;
  background: var(--surface2);
}

.ticker-section-body {
  padding: 20px;
  font-size: 14px;
  line-height: 1.7;
  color: #c9d1d9;
}

/* LOADING */
.loading-dots {
  display: inline-flex;
  gap: 4px;
  align-items: center;
}

.loading-dots span {
  width: 6px;
  height: 6px;
  background: var(--accent);
  border-radius: 50%;
  animation: dot-bounce 1.2s infinite;
}

.loading-dots span:nth-child(2) { animation-delay: 0.2s; }
.loading-dots span:nth-child(3) { animation-delay: 0.4s; }

@keyframes dot-bounce {
  0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
  40% { transform: translateY(-6px); opacity: 1; }
}

/* MOBILE */
@media (max-width: 768px) {
  .sidebar { transform: translateX(-100%); transition: transform 0.3s; }
  .sidebar.open { transform: translateX(0); }
  .main { margin-left: 0; padding: 20px; }
  .day-title { font-size: 36px; }
  .menu-btn { display: flex; }
}

.menu-btn {
  display: none;
  background: none;
  border: none;
  color: var(--text);
  cursor: pointer;
  padding: 8px;
  font-size: 20px;
}

/* SCROLLBAR */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--surface); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

/* SIGNAL TABLE */
.signal-row { display: flex; gap: 12px; margin: 8px 0; align-items: flex-start; }
.signal-icon { font-size: 18px; flex-shrink: 0; margin-top: 2px; }
.signal-text { font-size: 14px; line-height: 1.6; color: #c9d1d9; }
.signal-text strong { color: var(--text); }

.fade-in {
  animation: fadeIn 0.4s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<header>
  <div class="logo">GEX<span>MASTERY</span></div>
  <button class="menu-btn" onclick="toggleSidebar()">☰</button>
  <div class="header-meta">
    <div>7-DAY SPRINT — SPY · QQQ · TSLA</div>
    <div class="progress-bar-outer">
      <div class="progress-bar-inner" id="progressBar" style="width:14%"></div>
    </div>
  </div>
</header>

<div class="app-layout">

<!-- SIDEBAR -->
<nav class="sidebar" id="sidebar">
  <div class="sidebar-section-title">CURRICULUM</div>

  <div class="day-nav-item active" onclick="switchDay(0)">
    <div class="day-badge">F</div>
    <div class="day-nav-info">
      <div class="day-nav-title">Foundation</div>
      <div class="day-nav-sub">Options Basics</div>
    </div>
  </div>

  <div class="day-nav-item" onclick="switchDay(1)">
    <div class="day-badge">1</div>
    <div class="day-nav-info">
      <div class="day-nav-title">Day 1–2</div>
      <div class="day-nav-sub">Market Microstructure</div>
    </div>
  </div>

  <div class="day-nav-item" onclick="switchDay(2)">
    <div class="day-badge">3</div>
    <div class="day-nav-info">
      <div class="day-nav-title">Day 3</div>
      <div class="day-nav-sub">Data & Visualization</div>
    </div>
  </div>

  <div class="day-nav-item" onclick="switchDay(3)">
    <div class="day-badge">4</div>
    <div class="day-nav-info">
      <div class="day-nav-title">Day 4</div>
      <div class="day-nav-sub">Regime Analysis</div>
    </div>
  </div>

  <div class="day-nav-item" onclick="switchDay(4)">
    <div class="day-badge">5</div>
    <div class="day-nav-info">
      <div class="day-nav-title">Day 5–6</div>
      <div class="day-nav-sub">Strategic Execution</div>
    </div>
  </div>

  <div class="day-nav-item" onclick="switchDay(5)">
    <div class="day-badge">7</div>
    <div class="day-nav-info">
      <div class="day-nav-title">Day 7</div>
      <div class="day-nav-sub">Simulation & Testing</div>
    </div>
  </div>

  <div class="sidebar-section-title" style="margin-top:16px;">TARGET TICKERS</div>
  <div style="padding: 8px 20px; display:flex; flex-direction:column; gap:6px;">
    <div style="display:flex; justify-content:space-between; font-size:13px;">
      <span style="font-family:var(--mono); color:var(--accent4);">SPY</span>
      <span style="color:var(--text-dim);">Index ETF</span>
    </div>
    <div style="display:flex; justify-content:space-between; font-size:13px;">
      <span style="font-family:var(--mono); color:var(--accent3);">QQQ</span>
      <span style="color:var(--text-dim);">Tech ETF</span>
    </div>
    <div style="display:flex; justify-content:space-between; font-size:13px;">
      <span style="font-family:var(--mono); color:var(--accent2);">TSLA</span>
      <span style="color:var(--text-dim);">High Vol</span>
    </div>
  </div>
</nav>

<!-- MAIN CONTENT -->
<main class="main" id="mainContent">
  <!-- Content injected by JS -->
</main>

</div>

<script>
// ============================================================
// CURRICULUM DATA
// ============================================================

const days = [

// ============================
// FOUNDATION
// ============================
{
  tag: "PREREQUISITE",
  title: "FOUNDATION",
  subtitle: "Before GEX makes sense, you need a mechanical understanding of what options ARE and how they move. This is not hand-holding — this is calibration. Every elite GEX trader has these mechanics running automatically in the background.",
  tickers: [],
  lessons: [
    {
      id: "f1",
      type: "A",
      typeLabel: "MECHANICAL REALITY",
      title: "What is an Option Contract?",
      content: `
        <p>An option is a <strong>contract</strong> that gives the buyer the <strong>right but not the obligation</strong> to buy (Call) or sell (Put) 100 shares of a stock at a specific price (the Strike Price) by a specific date (Expiration).</p>

function drawMMHedging(canvasId) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.fillStyle = '#0a0e12';
  ctx.fillRect(0, 0, w, h);

  // Draw feedback loop arrows
  const cx = w/2, cy = h/2;
  const steps = [
    { label: 'MM SELLS PUT', color: '#ff4466', x: cx, y: 40 },
    { label: 'MM SELLS SHARES\n(Delta Hedge)', color: '#ffaa00', x: w-140, y: cy-40 },
    { label: 'SPY PRICE DROPS', color: '#ff4466', x: cx, y: h-50 },
    { label: 'PUT GAINS DELTA\n(More Negative)', color: '#ffaa00', x: 100, y: cy-40 },
  ];

  // Draw connecting lines with arrows
  ctx.strokeStyle = '#21262d';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([4, 4]);
  ctx.beginPath();
  ctx.arc(cx, cy, 100, 0, Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);

  steps.forEach((s, i) => {
    const nextS = steps[(i+1) % steps.length];
    // Arrow from s to nextS
    ctx.strokeStyle = s.color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(s.x, s.y + 20);
    ctx.lineTo(nextS.x, nextS.y + 20);
    ctx.stroke();

    // Box
    ctx.fillStyle = i % 2 === 0 ? 'rgba(255,68,102,0.1)' : 'rgba(255,170,0,0.1)';
    ctx.strokeStyle = s.color;
    ctx.lineWidth = 1;
    const bw = 160, bh = 44;
    ctx.beginPath();
    ctx.roundRect(s.x - bw/2, s.y - 10, bw, bh, 6);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = s.color;
    ctx.font = 'bold 11px Space Mono, monospace';
    ctx.textAlign = 'center';
    s.label.split('\n').forEach((line, li) => {
      ctx.fillText(line, s.x, s.y + 8 + li * 14);
    });
  });

  // Center label
  ctx.fillStyle = '#00ff88';
  ctx.font = 'bold 12px Space Mono, monospace';
  ctx.textAlign = 'center';
  ctx.fillText('FEEDBACK', cx, cy - 8);
  ctx.fillText('LOOP', cx, cy + 8);

  // Arrow heads
  function arrowHead(x, y, angle, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(-8, -5);
    ctx.lineTo(-8, 5);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
}

function drawGreeksChart(canvasId) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.fillStyle = '#0a0e12';
  ctx.fillRect(0, 0, w, h);

  const padL = 60, padR = 20, padT = 30, padB = 50;
  const cw = w - padL - padR, ch = h - padT - padB;

  // Grid
  ctx.strokeStyle = '#1a1f27';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = padT + (ch / 4) * i;
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL + cw, y); ctx.stroke();
  }

  // X axis (strikes from deep OTM to deep ITM)
  const strikes = [-40, -30, -20, -10, 0, 10, 20, 30, 40];

  // Delta curve (S-curve for call)
  ctx.strokeStyle = '#00ff88';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  strikes.forEach((s, i) => {
    const x = padL + (i / (strikes.length - 1)) * cw;
    const delta = 1 / (1 + Math.exp(-s * 0.12));
    const y = padT + ch - delta * ch;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.stroke();

  // Gamma curve (bell curve, peaks at ATM)
  ctx.strokeStyle = '#00aaff';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  strikes.forEach((s, i) => {
    const x = padL + (i / (strikes.length - 1)) * cw;
    const gamma = Math.exp(-(s * s) / 120);
    const y = padT + ch - gamma * ch * 0.85;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.stroke();

  // Labels
  ctx.font = '11px Space Mono, monospace';
  ctx.fillStyle = '#00ff88';
  ctx.fillText('Δ Delta', padL + cw - 60, padT + 20);
  ctx.fillStyle = '#00aaff';
  ctx.fillText('Γ Gamma', padL + cw/2 - 20, padT + 16);

  // ATM line
  const atmX = padL + cw / 2;
  ctx.strokeStyle = '#21262d';
  ctx.setLineDash([4, 4]);
  ctx.beginPath();
  ctx.moveTo(atmX, padT);
  ctx.lineTo(atmX, padT + ch);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#7d8590';
  ctx.font = '10px Space Mono, monospace';
  ctx.textAlign = 'center';
  ctx.fillText('ATM', atmX, padT + ch + 16);
  ctx.fillText('← OTM', atmX - 80, padT + ch + 30);
  ctx.fillText('ITM →', atmX + 80, padT + ch + 30);

  ctx.textAlign = 'left';
  ctx.fillStyle = '#7d8590';
  ctx.font = '10px Space Mono, monospace';
  ctx.fillText('1.0', padL - 30, padT + 8);
  ctx.fillText('0.5', padL - 30, padT + ch/2 + 4);
  ctx.fillText('0.0', padL - 30, padT + ch + 4);
}

function drawZeroGammaChart(canvasId) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.fillStyle = '#0a0e12';
  ctx.fillRect(0, 0, w, h);

  const padL = 20, padR = 120, padT = 30, padB = 40;
  const cw = w - padL - padR, ch = h - padT - padB;

  const zglPrice = 520;
  const currentPrice = 535;
  const priceRange = [500, 560];
  const priceToX = (p) => padL + ((p - priceRange[0]) / (priceRange[1] - priceRange[0])) * cw;

  // GEX bars
  const strikes = [500, 505, 510, 515, 520, 525, 530, 535, 540, 545, 550];
  const gexValues = [-80, -60, -40, -20, 0, 30, 60, 90, 40, 20, 10];
  const maxGex = 100;

  // Background zones
  const zglX = priceToX(zglPrice);
  ctx.fillStyle = 'rgba(255,68,102,0.04)';
  ctx.fillRect(padL, padT, zglX - padL, ch);
  ctx.fillStyle = 'rgba(0,255,136,0.04)';
  ctx.fillRect(zglX, padT, cw - (zglX - padL), ch);

  // Zone labels
  ctx.font = '10px Space Mono, monospace';
  ctx.fillStyle = 'rgba(255,68,102,0.5)';
  ctx.textAlign = 'center';
  ctx.fillText('SHORT GAMMA', (padL + zglX) / 2, padT + 15);
  ctx.fillStyle = 'rgba(0,255,136,0.5)';
  ctx.fillText('LONG GAMMA', (zglX + padL + cw) / 2, padT + 15);

  // GEX bars
  const barW = cw / (strikes.length) * 0.6;
  strikes.forEach((strike, i) => {
    const x = priceToX(strike);
    const gex = gexValues[i];
    const barH = (Math.abs(gex) / maxGex) * (ch / 2.2);
    const midY = padT + ch / 2;

    ctx.fillStyle = gex >= 0 ? 'rgba(0,255,136,0.6)' : 'rgba(255,68,102,0.6)';
    if (gex >= 0) {
      ctx.fillRect(x - barW/2, midY - barH, barW, barH);
    } else {
      ctx.fillRect(x - barW/2, midY, barW, barH);
    }

    ctx.fillStyle = '#3d4450';
    ctx.font = '9px Space Mono, monospace';
    ctx.textAlign = 'center';
    ctx.fillText(strike, x, padT + ch + 16);
  });

  // Zero line
  ctx.strokeStyle = '#3d4450';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(padL, padT + ch/2);
  ctx.lineTo(padL + cw, padT + ch/2);
  ctx.stroke();

  // ZGL line
  ctx.strokeStyle = '#ffaa00';
  ctx.lineWidth = 2;
  ctx.setLineDash([5, 3]);
  ctx.beginPath();
  ctx.moveTo(zglX, padT);
  ctx.lineTo(zglX, padT + ch);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#ffaa00';
  ctx.font = 'bold 10px Space Mono, monospace';
  ctx.textAlign = 'left';
  ctx.fillText(`ZGL`, padL + cw + 8, padT + ch/2 - 20);
  ctx.fillText(`$${zglPrice}`, padL + cw + 8, padT + ch/2 - 8);

  // Current price line
  const cpX = priceToX(currentPrice);
  ctx.strokeStyle = '#00ff88';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cpX, padT);
  ctx.lineTo(cpX, padT + ch);
  ctx.stroke();
  ctx.fillStyle = '#00ff88';
  ctx.textAlign = 'left';
  ctx.fillText(`SPY`, padL + cw + 8, padT + 20);
  ctx.fillText(`$${currentPrice}`, padL + cw + 8, padT + 32);
}

function drawRegimeChart(canvasId) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.fillStyle = '#0a0e12';
  ctx.fillRect(0, 0, w, h);

  const padL = 40, padR = 20, padT = 30, padB = 40;
  const cw = w - padL - padR, ch = h - padT - padB;

  // Simulated price path
  const path = [];
  let price = 520;
  const zgl = 515;

  for (let i = 0; i < 80; i++) {
    let regime = price > zgl ? 'long' : 'short';
    let move;
    if (regime === 'long') {
      move = (Math.random() - 0.52) * 1.5; // slight mean revert
    } else {
      move = (Math.random() - 0.45) * 3.5; // trend amplify
    }
    price += move;
    path.push({ price, regime });
  }

  const prices = path.map(p => p.price);
  const minP = Math.min(...prices) - 2;
  const maxP = Math.max(...prices) + 2;
  const pToY = (p) => padT + ch - ((p - minP) / (maxP - minP)) * ch;
  const iToX = (i) => padL + (i / (path.length - 1)) * cw;

  // Colored background by regime
  let start = 0;
  for (let i = 1; i <= path.length; i++) {
    const changed = i === path.length || path[i]?.regime !== path[i-1]?.regime;
    if (changed) {
      ctx.fillStyle = path[start].regime === 'long'
        ? 'rgba(0,255,136,0.05)' : 'rgba(255,68,102,0.05)';
      ctx.fillRect(iToX(start), padT, iToX(Math.min(i, path.length-1)) - iToX(start), ch);
      start = i;
    }
  }

  // ZGL line
  const zglY = pToY(zgl);
  ctx.strokeStyle = '#ffaa00';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([4, 4]);
  ctx.beginPath();
  ctx.moveTo(padL, zglY);
  ctx.lineTo(padL + cw, zglY);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#ffaa00';
  ctx.font = '10px Space Mono, monospace';
  ctx.textAlign = 'left';
  ctx.fillText(`ZGL $${zgl}`, padL + 4, zglY - 4);

  // Price line
  ctx.strokeStyle = '#00aaff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  path.forEach((p, i) => {
    const x = iToX(i);
    const y = pToY(p.price);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.stroke();

  // Labels
  ctx.fillStyle = 'rgba(0,255,136,0.6)';
  ctx.font = 'bold 10px Space Mono, monospace';
  ctx.textAlign = 'center';
  ctx.fillText('LONG GAMMA: Mean Reverting', padL + cw * 0.25, padT + 15);
  ctx.fillStyle = 'rgba(255,68,102,0.6)';
  ctx.fillText('SHORT GAMMA: Trend Expanding', padL + cw * 0.75, padT + 15);
}

function drawTargetPriceChart(canvasId) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.fillStyle = '#0a0e12';
  ctx.fillRect(0, 0, w, h);

  const levels = [
    { price: 545, label: 'CALL WALL', color: '#00ff88', desc: '2nd Target' },
    { price: 540, label: 'CALL WALL', color: '#00aaff', desc: '1st Target' },
    { price: 535, label: 'CURRENT PRICE', color: '#ffffff', desc: 'Entry Zone' },
    { price: 528, label: 'ZGL', color: '#ffaa00', desc: 'Regime Line' },
    { price: 522, label: 'PUT WALL', color: '#ff6688', desc: 'Support' },
    { price: 515, label: 'PUT WALL', color: '#ff4466', desc: 'Hard Floor' },
  ];

  const padL = 100, padR = 180, padT = 20, padB = 20;
  const ch = h - padT - padB;

  const allPrices = levels.map(l => l.price);
  const minP = Math.min(...allPrices) - 5;
  const maxP = Math.max(...allPrices) + 5;
  const pToY = (p) => padT + ch - ((p - minP) / (maxP - minP)) * ch;

  levels.forEach(l => {
    const y = pToY(l.price);
    // Line
    ctx.strokeStyle = l.color;
    ctx.lineWidth = l.label === 'CURRENT PRICE' ? 2.5 : 1.5;
    ctx.setLineDash(l.label === 'CURRENT PRICE' ? [] : [5, 3]);
    ctx.beginPath();
    ctx.moveTo(padL, y);
    ctx.lineTo(w - padR, y);
    ctx.stroke();
    ctx.setLineDash([]);

    // Left label (price)
    ctx.fillStyle = l.color;
    ctx.font = 'bold 11px Space Mono, monospace';
    ctx.textAlign = 'right';
    ctx.fillText(`$${l.price}`, padL - 8, y + 4);

    // Right labels
    ctx.textAlign = 'left';
    ctx.fillStyle = l.color;
    ctx.font = 'bold 11px Space Mono, monospace';
    ctx.fillText(l.label, w - padR + 10, y - 2);
    ctx.fillStyle = '#7d8590';
    ctx.font = '10px Space Mono, monospace';
    ctx.fillText(l.desc, w - padR + 10, y + 10);
  });

  // Profit zone shading
  const entryY = pToY(535);
  const target1Y = pToY(540);
  ctx.fillStyle = 'rgba(0,255,136,0.06)';
  ctx.fillRect(padL, target1Y, w - padL - padR, entryY - target1Y);
  ctx.fillStyle = 'rgba(0,170,255,0.06)';
  const target2Y = pToY(545);
  ctx.fillRect(padL, target2Y, w - padL - padR, target1Y - target2Y);

  // Stop zone shading
  const zglY = pToY(528);
  ctx.fillStyle = 'rgba(255,170,0,0.04)';
  ctx.fillRect(padL, entryY, w - padL - padR, zglY - entryY);

  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(0,255,136,0.5)';
  ctx.font = '10px Space Mono, monospace';
  ctx.fillText('PROFIT ZONE', padL + (w - padL - padR)/2, (entryY + target1Y)/2 + 4);
}

function drawIVCrushChart(canvasId) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.fillStyle = '#0a0e12';
  ctx.fillRect(0, 0, w, h);

  const padL = 50, padR = 20, padT = 30, padB = 50;
  const cw = w - padL - padR, ch = h - padT - padB;

  // IV line
  const ivData = [85, 83, 86, 84, 82, 88, 85, 90, 45, 43, 41, 44, 42];
  const priceData = [100, 99, 101, 100, 98, 102, 100, 101, 103, 102, 101, 103, 102];
  const optData = [5.2, 5.0, 5.4, 5.1, 4.9, 5.5, 5.2, 5.8, 2.3, 2.2, 2.1, 2.3, 2.1];

  const drawLine = (data, color, minV, maxV, dashed) => {
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    if (dashed) ctx.setLineDash([4, 3]);
    ctx.beginPath();
    data.forEach((v, i) => {
      const x = padL + (i / (data.length - 1)) * cw;
      const y = padT + ch - ((v - minV) / (maxV - minV)) * ch;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.stroke();
    ctx.setLineDash([]);
  };

  drawLine(ivData, '#ffaa00', 30, 100, false);
  drawLine(priceData, '#00aaff', 90, 115, true);
  drawLine(optData, '#ff4466', 0, 8, false);

  // Earnings line
  const earningsX = padL + (8 / (ivData.length - 1)) * cw;
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([3, 3]);
  ctx.beginPath();
  ctx.moveTo(earningsX, padT);
  ctx.lineTo(earningsX, padT + ch);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#ffffff';
  ctx.font = '10px Space Mono, monospace';
  ctx.textAlign = 'center';
  ctx.fillText('EARNINGS', earningsX, padT + ch + 16);
  ctx.fillText('REPORT', earningsX, padT + ch + 28);

  // Legend
  ctx.font = '10px Space Mono, monospace';
  ctx.textAlign = 'left';
  [[ivData, '#ffaa00', 'IMPLIED VOL'], [priceData, '#00aaff', 'TSLA PRICE'], [optData, '#ff4466', 'OPTION VALUE']].forEach(([,color, label], i) => {
    ctx.fillStyle = color;
    ctx.fillText(label, padL + 4, padT + 14 + i * 14);
  });

  ctx.fillStyle = '#ff4466';
  ctx.font = 'bold 11px Space Mono, monospace';
  ctx.textAlign = 'center';
  ctx.fillText('IV CRUSH: -47% IV → Option -60% value', w/2, padT + ch + 42);
}

function drawOptionBasics(canvasId) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.fillStyle = '#0a0e12';
  ctx.fillRect(0, 0, w, h);

  // Two columns: Call and Put
  const col = (side) => side === 'call' ? w * 0.25 : w * 0.75;

  const drawBox = (x, y, bw, bh, color, label, sublabel) => {
    ctx.fillStyle = color + '15';
    ctx.strokeStyle = color + '60';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect(x - bw/2, y - bh/2, bw, bh, 8);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = color;
    ctx.font = 'bold 13px Space Mono, monospace';
    ctx.textAlign = 'center';
    ctx.fillText(label, x, y + 2);
    if (sublabel) {
      ctx.fillStyle = '#7d8590';
      ctx.font = '10px DM Sans, sans-serif';
      ctx.fillText(sublabel, x, y + 16);
    }
  };

  // Call side
  drawBox(col('call'), 55, 180, 44, '#00ff88', 'CALL OPTION', 'Right to BUY');
  drawBox(col('call'), 130, 160, 36, '#00ff88', 'BUYER', 'Pays premium');
  drawBox(col('call'), 200, 160, 36, '#7d8590', 'MARKET MAKER', 'Collects premium');

  // Arrow
  ctx.strokeStyle = '#00ff88';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(col('call') - 50, 140); ctx.lineTo(col('call') - 50, 152); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(col('call') + 10, 140); ctx.lineTo(col('call') + 10, 152); ctx.stroke();

  // Payoff diagram Call
  const cx = col('call'), baseY = 270, chartW = 180, chartH = 90;
  ctx.strokeStyle = '#21262d'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(cx - chartW/2, baseY); ctx.lineTo(cx + chartW/2, baseY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx - 20, baseY - 10); ctx.lineTo(cx - 20, baseY - chartH); ctx.stroke(); // y axis
  ctx.strokeStyle = '#00ff88'; ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(cx - chartW/2, baseY - 12);
  ctx.lineTo(cx - 20, baseY - 12);
  ctx.lineTo(cx + chartW/2, baseY - chartH + 10);
  ctx.stroke();
  ctx.fillStyle = '#00ff88'; ctx.font = 'bold 10px Space Mono, monospace'; ctx.textAlign = 'center';
  ctx.fillText('CALL PAYOFF PROFILE', cx, baseY + 16);
  ctx.fillStyle = '#7d8590'; ctx.font = '9px Space Mono, monospace';
  ctx.fillText('Profit ↑ as price rises', cx, baseY + 28);

  // Put side
  drawBox(col('put'), 55, 180, 44, '#ff4466', 'PUT OPTION', 'Right to SELL');
  drawBox(col('put'), 130, 160, 36, '#ff4466', 'BUYER', 'Pays premium');
  drawBox(col('put'), 200, 160, 36, '#7d8590', 'MARKET MAKER', 'Collects premium');

  const px = col('put'), baseY2 = 270;
  ctx.strokeStyle = '#21262d'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(px - chartW/2, baseY2); ctx.lineTo(px + chartW/2, baseY2); ctx.stroke();
  ctx.strokeStyle = '#ff4466'; ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(px - chartW/2, baseY2 - chartH + 10);
  ctx.lineTo(px + 20, baseY2 - 12);
  ctx.lineTo(px + chartW/2, baseY2 - 12);
  ctx.stroke();
  ctx.fillStyle = '#ff4466'; ctx.font = 'bold 10px Space Mono, monospace';
  ctx.fillText('PUT PAYOFF PROFILE', px, baseY2 + 16);
  ctx.fillStyle = '#7d8590'; ctx.font = '9px Space Mono, monospace';
  ctx.fillText('Profit ↑ as price falls', px, baseY2 + 28);

  // Middle divider
  ctx.strokeStyle = '#21262d'; ctx.lineWidth = 1; ctx.setLineDash([4,4]);
  ctx.beginPath(); ctx.moveTo(w/2, 20); ctx.lineTo(w/2, h - 20); ctx.stroke();
  ctx.setLineDash([]);
}

function drawGenericPlaceholder(canvasId, label) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.fillStyle = '#0a0e12';
  ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = '#1a1f27';
  ctx.lineWidth = 1;
  for (let i = 0; i < w; i += 30) {
    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, h); ctx.stroke();
  }
  for (let j = 0; j < h; j += 30) {
    ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(w, j); ctx.stroke();
  }
  ctx.fillStyle = '#21262d';
  ctx.font = 'bold 14px Space Mono, monospace';
  ctx.textAlign = 'center';
  ctx.fillText(label, w/2, h/2);
}

  html += `<div class="day-nav-btns">`;
  if (dayIndex > 0) {
    html += `<button class="nav-btn" onclick="switchDay(${dayIndex - 1})">← PREVIOUS</button>`;
  }
  if (dayIndex < days.length - 1) {
    html += `<button class="nav-btn primary" onclick="switchDay(${dayIndex + 1})">NEXT DAY →</button>`;
  } else {
    html += `<button class="nav-btn primary" style="background:var(--accent3);border-color:var(--accent3);">🎯 SPRINT COMPLETE</button>`;
  }
  html += `</div></div>`;

  main.innerHTML = html;

  // Render diagrams
  setTimeout(() => {
    day.lessons.forEach(lesson => {
      if (lesson.diagram && lesson.type !== 'C') {
        const canvasId = `canvas-${lesson.id}`;
        const renderer = diagramRenderers[lesson.diagram];
        if (renderer) renderer(canvasId);
      }
    });
  }, 100);

  // Update sidebar
  document.querySelectorAll('.day-nav-item').forEach((el, i) => {
    el.classList.toggle('active', i === dayIndex);
    if (i < dayIndex) el.classList.add('completed');
  });

  // Update progress
  const pct = ((dayIndex + 1) / days.length) * 100;
  document.getElementById('progressBar').style.width = pct + '%';

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ============================================================
// STRESS TEST GRADING
// ============================================================

async function submitAnswer(stressId) {
  const answer = document.getElementById(`answer-${stressId}`).value.trim();
  if (!answer || answer.length < 30) {
    alert('Your answer is too short. Write a complete, precise response.');
    return;
  }

  const btn = document.getElementById(`btn-${stressId}`);
  const feedback = document.getElementById(`feedback-${stressId}`);
  const feedbackText = document.getElementById(`feedback-text-${stressId}`);

  btn.disabled = true;
  btn.innerHTML = '<span class="loading-dots"><span></span><span></span><span></span></span> GRADING...';
  feedback.style.display = 'block';
  feedback.classList.add('show');
  feedbackText.innerHTML = '<span style="color:var(--text-dim);">Analyzing your answer with aerospace-level precision...</span>';

  // Find the lesson
  let systemPrompt = '';
  days.forEach(day => {
    day.lessons.forEach(lesson => {
      if (lesson.stressId === stressId) {
        systemPrompt = lesson.systemPrompt;
      }
    });
  });

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: systemPrompt,
        messages: [{ role: 'user', content: answer }]
      })
    });

    const data = await response.json();
    const text = data.content?.map(c => c.text || '').join('') || 'Error: No response received.';

    // Format feedback
    let formattedText = text
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/\n\n/g, '</p><p>')
      .replace(/\n/g, '<br>');

    const verdict = text.includes('PASS') ? 'var(--accent)' : text.includes('PARTIAL') ? 'var(--accent3)' : 'var(--accent2)';
    feedbackText.innerHTML = `<p style="color:${verdict};font-weight:bold;font-family:var(--mono);margin-bottom:12px;">` +
      (text.includes('PASS') ? '✓ PASS' : text.includes('PARTIAL') ? '◐ PARTIAL' : '✗ FAIL') +
      `</p><p>${formattedText}</p>`;

    btn.innerHTML = 'RESUBMIT ANSWER';
    btn.disabled = false;

  } catch (err) {
    feedbackText.innerHTML = `<span style="color:var(--accent2);">Error connecting to grading system. Check your connection and try again.</span>`;
    btn.innerHTML = 'RETRY SUBMISSION';
    btn.disabled = false;
  }
}

// ============================================================
// NAVIGATION
// ============================================================

function switchDay(index) {
  currentDay = index;
  renderDay(index);
  if (window.innerWidth <= 768) {
    document.getElementById('sidebar').classList.remove('open');
  }
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

// ============================================================
renderDay(0);
